name: PostgreSQL staging build
on:
  push:
    branches: [feature/postgres-staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: tasktracker_staging
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATA_BACKEND: postgres
      NEXT_PUBLIC_COMPANY_DOMAIN: collegedunia.com
      DATABASE_ADMIN_URL: postgresql://postgres:synthetic-ci-only@127.0.0.1:5432/tasktracker_staging
      DATABASE_URL: postgresql://tasktracker_runtime:synthetic-runtime-only@127.0.0.1:5432/tasktracker_staging
      ATTACHMENTS_DIR: /tmp/tasktracker-ci-files
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node --test tests/*.test.cjs
      - run: node tests/postgres-staging.mjs
      - name: Install real staging database
        run: |
          node scripts/postgres/migrate.mjs
          node --input-type=module -e "import pg from 'pg'; const db=new pg.Client({connectionString:process.env.DATABASE_ADMIN_URL}); await db.connect(); await db.query(\"ALTER ROLE tasktracker_runtime PASSWORD 'synthetic-runtime-only'\"); await db.end();"
      - run: npm run build -- --webpack
      - run: npx playwright install --with-deps chromium
      - name: Test eight sessions against PostgreSQL 16
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          PORT=3104 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/staging-server.log 2>&1 &
          for n in $(seq 1 30); do
            if curl -fsS http://localhost:3104/login >/dev/null; then break; fi
            sleep 1
          done
          node tests/postgres-browser.mjs
      - name: Package Linux staging build
        run: |
          mkdir -p .next/standalone/.next
          cp -r postgres deploy scripts .next/standalone/
          test -z "$(find .next/standalone -name '.env*' -print)"
          tar -czf tasktracker-postgres-staging.tar.gz -C .next/standalone .
          sha256sum tasktracker-postgres-staging.tar.gz > tasktracker-postgres-staging.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tasktracker-postgres-staging
          path: |
            tasktracker-postgres-staging.tar.gz
            tasktracker-postgres-staging.sha256
          retention-days: 7
          if-no-files-found: error
      - name: Server diagnostics on failure
        if: failure()
        run: test ! -f /tmp/staging-server.log || tail -n 80 /tmp/staging-server.log
