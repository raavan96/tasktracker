server {
    listen 80;
    server_name tasktracker.top-menus.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://tasktracker.top-menus.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name tasktracker.top-menus.com;
    client_max_body_size 12m;
    ssl_certificate /etc/letsencrypt/live/tasktracker.top-menus.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasktracker.top-menus.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
