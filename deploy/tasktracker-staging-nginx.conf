# Separate HTTPS port: keep the existing live server blocks unchanged.
limit_req_zone $binary_remote_addr zone=staging_login:1m rate=5r/m;
server {
    listen 8443 ssl;
    server_name 168.144.155.51;
    ssl_certificate /etc/letsencrypt/live/168.144.155.51/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/168.144.155.51/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    location = /login {
        limit_req zone=staging_login burst=15 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3104;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:3104;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }
}
