<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskTracker — dashboard previews</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eaf1f4;color:#183539;font:15px system-ui,sans-serif}header{padding:24px max(20px,4vw);background:white;border-bottom:1px solid #bdcdd1}h1{font-size:24px;margin:0 0 8px}p{line-height:1.5;margin:8px 0;color:#48616a}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}button,select{font:inherit;border:1px solid #73888e;border-radius:9px;background:white;color:#183539;padding:10px 15px;cursor:pointer}button[aria-pressed=true]{background:#086b6b;color:white;border-color:#086b6b}select{margin-left:auto}main{padding:24px max(12px,3vw)}.note{max-width:1000px;margin:0 auto 18px}figure{margin:0 auto;max-width:1440px;background:white;border:1px solid #b4c9cf;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px #19343c20}img{display:block;width:100%;height:auto}figure.phone{max-width:430px}button:focus-visible,select:focus-visible{outline:3px solid #137989;outline-offset:3px}.badge{color:#086b6b;font-weight:600;font-size:12px;letter-spacing:.08em}#loading{padding:30px}</style>
<header><div class="badge">PREVIEW · NOT DEPLOYED</div><h1>TaskTracker dashboard overviews</h1><p>Real app screenshots from the validated preview build, using isolated test data. Switch pages, theme, and screen size below. Controls inside the screenshots are not interactive.</p><div class="controls" id="pages"><button data-page="projects">Projects</button><button data-page="tasks">All Tasks</button><button data-page="my-tasks">My Tasks</button><button data-page="archive">Archive</button><button data-page="workload">Workload</button></div><div class="controls"><button id="dark">Dark mode</button><button id="light">Light mode</button><select id="size" aria-label="Screen size"><option value="1440">Desktop</option><option value="430">Phone — 430px</option></select></div></header>
<main><p class="note" id="note"></p><figure id="frame"><img id="preview" alt=""><p id="loading" hidden>Preview image is not available yet.</p></figure></main>
<script>let page='projects',theme='dark',width='1440';const descriptions={projects:'Project status is now separate from task status. “Needs attention” and “Ready to complete” are subsets of active projects; completion remains an explicit creator/admin action.',tasks:'All Tasks summarizes every active task you can access. Each summary card opens the corresponding task filter.', 'my-tasks':'My Tasks uses only your assigned work. Card links stay in My Tasks so personal scope is preserved.',archive:'Archive separates general archived projects, explicitly completed projects, and tasks in the general archive. Counts are independent of archive search.',workload:'Workload counts each task once in its summary. The table lists shared tasks under each assignee, so its rows are not intended to sum to the summary.'};function render(){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.page===page));['dark','light'].forEach(t=>document.getElementById(t).setAttribute('aria-pressed',theme===t));document.getElementById('note').textContent=descriptions[page];document.getElementById('frame').className=width==='430'?'phone':'';const img=document.getElementById('preview');img.alt=`${page} dashboard, ${theme} theme, ${width}px screen, sample data`;img.src=`release5-overview-${page}-${theme}-${width}.png?v=44f4702`;}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});['dark','light'].forEach(t=>document.getElementById(t).onclick=()=>{theme=t;render()});document.getElementById('size').onchange=e=>{width=e.target.value;render()};document.getElementById('preview').onerror=()=>document.getElementById('loading').hidden=false;document.getElementById('preview').onload=()=>document.getElementById('loading').hidden=true;render();</script></html>
